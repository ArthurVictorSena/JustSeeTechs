<div class="container">
    <h2>Solicite um Serviço</h2>
    <form>
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" required>



      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="servico">Tipo de Serviço</label>
      <select id="servico" name="servico" required>
        <option value="" id="Selecione">Selecione...</option>
        <option value="desenvolvimento" id="desenvolvimento">Desenvolvimento de Software</option>
        <option value="hardware" id="hardware">Manutenção de Hardware</option>
        <option value="office365" id="office365">Suporte em Office 365</option>
        <option value="Cibersegurança">Cibersegurança</option>
        <option value="TIVerde">TI Verde</option>
        <option value="Treinamento de equipe">Treinamento de Equipe</option>
        <option value="outro" id="outros">Outro</option>
      </select>

      <label for="descricao">Descreva sua necessidade</label>
      <textarea id="descricao" name="descricao" rows="5" required></textarea>

      <button type="submit" id="submit">Enviar Solicitação</button>
    </form>
